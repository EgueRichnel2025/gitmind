[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gitmind"
version = "0.1.0"
description = "An AI-powered Git workflow assistant for developers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.3,<1.0.0",
    "rich>=13.7.0,<15.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "ruff>=0.8,<1.0",
]

[project.scripts]
gitmind = "gitmind.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
